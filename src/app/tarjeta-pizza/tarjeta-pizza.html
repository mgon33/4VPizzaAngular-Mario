<div class="pizzas">
  <div class="cabecera-pizza">
    <h5 class="m-0">{{ pizza().nombre }} <strong>{{ pizza().precio }}€</strong></h5>
  </div>
  <img [src]="pizza().imagen" class="card-img-top" [alt]="pizza().nombre" style="height: 200px; object-fit: cover;">
  <div class="info-pizza">
    <h6>Ingredientes:</h6>
    <ul>
      @for (ingrediente of pizza().ingredientes; track ingrediente) {
        <li>{{ ingrediente }}</li>
      }
    </ul>

    <!-- Formulario para añadir esta pizza al pedido -->
    <div class="d-flex gap-2 mt-3">
      <input type="number" class="form-control form-control-sm" min="1" [formControl]="cantidad">
      <button type="button" class="btn btn-sm btn-danger" [disabled]="cantidad.invalid" (click)="anadir()">
        Añadir
      </button>
    </div>
  </div>
</div>
