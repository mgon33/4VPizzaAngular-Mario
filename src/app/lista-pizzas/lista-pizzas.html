<div class="row">
  @for (pizza of pizzasFiltradas; track pizza.nombre) {
    <!-- GRID adaptativo: 1 col (móvil), 2 col (tablet), 4 col (PC) -->
    <div class="col-12 col-md-6 col-lg-3 mb-4">
      <app-tarjeta-pizza [pizza]="pizza" (anadirPizza)="anadirPizza.emit($event)"></app-tarjeta-pizza>
    </div>
  } @empty {
    <p class="text-center text-muted">No hay pizzas con ese ingrediente.</p>
  }
</div>
